<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><linearGradient id="bg"><stop stop-color="#920700"/><stop offset="1" stop-color="#620400"/></linearGradient></defs><rect width="1200" height="520" rx="28" fill="url(#bg)"/><rect x="34" y="34" width="1132" height="452" rx="24" fill="none" stroke="#f6c46c" stroke-opacity=".22"/><g font-family="Arial,sans-serif" fill="white"><text x="72" y="76" font-size="20" font-weight="700" letter-spacing="3" fill="#f6c46c">FIRESAFE · СПЕЦИАЛЬНОЕ ПРЕДЛОЖЕНИЕ</text><text x="72" y="155" font-size="44" font-weight="800">Купите 20 кронштейнов —</text><text x="72" y="213" font-size="44" font-weight="800">получите 1 в подарок</text><text x="72" y="283" font-size="24" fill="#f7d9d2">Выгодное предложение для объектов,</text><text x="72" y="313" font-size="24" fill="#f7d9d2">монтажных бригад и регулярных закупок.</text><rect x="72" y="355" width="300" height="60" rx="14" fill="#f6c66f"/><text x="222" y="393" font-size="23" font-weight="700" text-anchor="middle" fill="#610500">Заказать по акции</text><text x="72" y="461" font-size="17" font-weight="700" fill="#f6c66f">ОБОРУДОВАНИЕ  ·  ПОДБОР  ·  ДОСТАВКА</text><rect x="750" y="110" width="378" height="305" rx="24" fill="#fff" fill-opacity=".08" stroke="#f6c46c" stroke-opacity=".4"/><text x="785" y="221" font-size="74" font-weight="800" fill="#ffdc91">20 + 1</text><text x="794" y="255" font-size="15" font-weight="700">ПОКУПАЕТЕ</text><text x="1017" y="255" font-size="15" font-weight="700">ПОДАРОК</text><text x="779" y="323" font-size="21" font-weight="600">Добавим один дополнительный</text><text x="779" y="353" font-size="21" font-weight="600">кронштейн к вашему заказу.</text></g></svg>